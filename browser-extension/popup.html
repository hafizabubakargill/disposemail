<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DisposeMail</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #09090f;
      color: #f0f0f8;
      overflow: hidden;
    }

    /* Glow */
    .bg-glow {
      position: fixed;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      padding: 18px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #2563eb 0%, #4f46e5 50%, #7c3aed 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .logo-icon svg {
      width: 17px;
      height: 17px;
      color: white;
    }

    .logo-text {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #3b82f6, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .status-dot {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: #4ade80;
      font-weight: 600;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      animation: blink 2s infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    /* Address Card */
    .card {
      background: linear-gradient(145deg, #111128, #0d0d1e);
      border: 1px solid rgba(99, 102, 241, 0.18);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.5), transparent);
    }

    .card-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #4b5563;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .email-address {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: #e2e8f0;
      word-break: break-all;
      line-height: 1.5;
    }

    .email-address.loading {
      opacity: 0.3;
    }

    .email-username {
      color: #60a5fa;
      font-weight: 700;
    }

    .email-domain {
      color: #818cf8;
    }

    /* Timer */
    .timer-wrap {
      margin-top: 12px;
    }

    .timer-label {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: #374151;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    .timer-label span:last-child {
      color: #818cf8;
    }

    .timer-bar {
      height: 3px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 99px;
      overflow: hidden;
    }

    .timer-fill {
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #7c3aed);
      border-radius: 99px;
      transition: width 60s linear;
    }

    /* Actions */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      letter-spacing: 0.2px;
    }

    .btn svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
    }

    .btn-primary:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.09);
      color: #e2e8f0;
    }

    .btn.success {
      background: linear-gradient(135deg, #059669, #047857) !important;
      color: white !important;
      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.3) !important;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.04);
      margin: 12px 0;
    }

    /* Recent Addresses — Premium Gate */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .section-title {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #374151;
      font-weight: 700;
    }

    .premium-badge {
      font-size: 8px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 4px;
      padding: 2px 6px;
    }

    .premium-gate {
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .premium-gate-icon {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .premium-gate-title {
      font-size: 12px;
      font-weight: 700;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .premium-gate-text {
      font-size: 10px;
      color: #374151;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .upgrade-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0a0a0f;
      font-size: 11px;
      font-weight: 800;
      border: none;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: 0.3px;
      transition: filter 0.15s;
    }

    .upgrade-btn:hover {
      filter: brightness(1.1);
    }

    /* History list (premium) */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .history-item:hover {
      background: rgba(37, 99, 235, 0.1);
      border-color: rgba(37, 99, 235, 0.3);
    }

    .history-email {
      font-family: monospace;
      font-size: 11px;
      color: #6b7280;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .use-btn {
      font-size: 9px;
      font-weight: 800;
      color: #3b82f6;
      background: none;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0;
      flex-shrink: 0;
    }

    .use-btn:hover {
      color: #60a5fa;
    }

    /* Footer */
    .footer {
      margin-top: 14px;
      text-align: center;
      font-size: 10px;
    }

    .inbox-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #4f46e5;
      text-decoration: none;
      font-weight: 700;
      font-size: 11px;
      transition: color 0.15s;
    }

    .inbox-link:hover {
      color: #818cf8;
    }

    .inbox-link svg {
      width: 10px;
      height: 10px;
    }
  </style>
</head>

<body>
  <div class="bg-glow"></div>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          </svg>
        </div>
        <span class="logo-text">DisposeMail</span>
      </div>
      <div class="status-dot">
        <div class="dot"></div>Active
      </div>
    </div>

    <!-- Address Card -->
    <div class="card">
      <div class="card-label">Your Temporary Address</div>
      <div id="email-display" class="email-address loading">Generating…</div>
      <div class="timer-wrap">
        <div class="timer-label">
          <span>Session</span>
          <span id="timer-text">—</span>
        </div>
        <div class="timer-bar">
          <div id="timer-fill" class="timer-fill" style="width:100%"></div>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button id="copy-btn" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
          stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
        Copy Address
      </button>
      <button id="refresh-btn" class="btn btn-secondary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M23 4v6h-6" />
          <path d="M1 20v-6h6" />
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
        </svg>
        New Address
      </button>
    </div>

    <div class="divider"></div>

    <!-- Recent Addresses (Premium Gate) -->
    <div class="section-header">
      <div class="section-title">Recent Addresses</div>
      <div class="premium-badge">★ Premium</div>
    </div>
    <div id="history-section">
      <!-- Filled by popup.js based on isPremium -->
    </div>

    <!-- Footer -->
    <div class="footer">
      <a id="inbox-link" href="https://disposemail.xyz" target="_blank" class="inbox-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
          <polyline points="15 3 21 3 21 9" />
          <line x1="10" y1="14" x2="21" y2="3" />
        </svg>
        Open Full Inbox at disposemail.xyz
      </a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
