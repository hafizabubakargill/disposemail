
# Add this to your Nginx configuration (usually in /etc/nginx/sites-available/default or via Hostinger Panel)

server {
    listen 80;
    server_name disposemail.xyz www.disposemail.xyz;
    
    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://disposemail.xyz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.disposemail.xyz;

    # SSL configuration would go here
    # Redirect WWW to non-WWW
    location / {
        return 301 https://disposemail.xyz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name disposemail.xyz;

    # SSL configuration would go here

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Real IP headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Explicitly route socket.io to ensure it doesn't get cached or blocked
    location /socket.io-live {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

