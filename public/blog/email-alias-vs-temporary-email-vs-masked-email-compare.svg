<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="t d"><title id="t">Temporary inbox vs forwarding alias vs plus-addressing</title><desc id="d">Comparison of three ways to protect an email address: a temporary inbox, a forwarding alias and plus-addressing.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#4f46e5"/></linearGradient></defs><rect width="1200" height="440" rx="24" fill="#ffffff"/><rect x="1" y="1" width="1198" height="438" rx="24" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="600" y="50" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1e1b4b">Three ways to keep your real address private</text><rect x="40" y="90" width="355" height="310" rx="18" fill="#f9fafb" stroke="#4f46e5" stroke-width="3"/><rect x="40" y="90" width="355" height="62" rx="18" fill="#4f46e5"/><text x="217" y="130" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#fff">Temporary inbox</text><text x="68" y="205" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1f2937">&#8226; No account</text><text x="68" y="259" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1f2937">&#8226; Deleted after a timer</text><text x="68" y="313" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1f2937">&#8226; Cannot be recovered</text><text x="68" y="367" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1f2937">&#8226; One-off needs</text><rect x="425" y="90" width="355" height="310" rx="18" fill="#f9fafb" stroke="#0891b2" stroke-width="3"/><rect x="425" y="90" width="355" height="62" rx="18" fill="#0891b2"/><text x="602" y="130" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#fff">Forwarding alias</text><text x="453" y="205" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1f2937">&#8226; Needs an account</text><text x="453" y="259" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1f2937">&#8226; Forwards to you</text><text x="453" y="313" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1f2937">&#8226; Can be switched off</text><text x="453" y="367" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1f2937">&#8226; Accounts you keep</text><rect x="810" y="90" width="355" height="310" rx="18" fill="#f9fafb" stroke="#d97706" stroke-width="3"/><rect x="810" y="90" width="355" height="62" rx="18" fill="#d97706"/><text x="987" y="130" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#fff">Plus-addressing</text><text x="838" y="205" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1f2937">&#8226; Built into some providers</text><text x="838" y="259" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1f2937">&#8226; Real address visible</text><text x="838" y="313" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1f2937">&#8226; Good for filtering</text><text x="838" y="367" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1f2937">&#8226; Low privacy</text></svg>