<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 554" role="img" aria-labelledby="t d"><title id="t">Work through these in order</title><desc id="d">Six-step checklist for a verification email that does not arrive: wait, check the address, check spam, resend once, check expiry, try another address.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#4f46e5"/></linearGradient></defs><rect width="1200" height="554" rx="24" fill="#ffffff"/><rect x="1" y="1" width="1198" height="552" rx="24" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="600" y="50" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1e1b4b">Work through these in order</text><rect x="30.0" y="90" width="560.0" height="118" rx="14" fill="#f9fafb" stroke="#6366f1" stroke-width="2"/><text x="52.0" y="128" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#3730a3">1. Wait 60 seconds</text><text x="52.0" y="160" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#374151">Some senders queue or delay mail to unfamiliar</text><text x="52.0" y="184" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#374151">servers.</text><rect x="610.0" y="90" width="560.0" height="118" rx="14" fill="#f9fafb" stroke="#6366f1" stroke-width="2"/><text x="632.0" y="128" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#3730a3">2. Check the address</text><text x="632.0" y="160" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#374151">One typo sends the code to someone else or</text><text x="632.0" y="184" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#374151">nowhere.</text><rect x="30.0" y="224" width="560.0" height="118" rx="14" fill="#f9fafb" stroke="#6366f1" stroke-width="2"/><text x="52.0" y="262" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#3730a3">3. Check spam and filters</text><text x="52.0" y="294" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#374151">Look in junk, promotions and any rules you set.</text><rect x="610.0" y="224" width="560.0" height="118" rx="14" fill="#f9fafb" stroke="#6366f1" stroke-width="2"/><text x="632.0" y="262" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#3730a3">4. Resend once</text><text x="632.0" y="294" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#374151">Repeated requests can trigger limits or</text><text x="632.0" y="318" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#374151">invalidate codes.</text><rect x="30.0" y="358" width="560.0" height="118" rx="14" fill="#f9fafb" stroke="#6366f1" stroke-width="2"/><text x="52.0" y="396" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#3730a3">5. Check the expiry</text><text x="52.0" y="428" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#374151">A temporary inbox is deleted after its timer</text><text x="52.0" y="452" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#374151">ends.</text><rect x="610.0" y="358" width="560.0" height="118" rx="14" fill="#f9fafb" stroke="#6366f1" stroke-width="2"/><text x="632.0" y="396" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#3730a3">6. Try another address</text><text x="632.0" y="428" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#374151">The site may refuse temporary domains.</text><text x="600" y="514" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#4b5563">If a real address also fails, the problem is with the sender, not with the inbox.</text></svg>