<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="t d"><title id="t">Password entropy by length</title><desc id="d">Bars show about 50 bits at 8 characters, 74 at 12, 99 at 16 and 124 at 20 for a random password from a 73-character set.</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs><rect width="1200" height="480" rx="24" fill="#ffffff"/><rect x="1" y="1" width="1198" height="478" rx="24" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="600" y="50" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1e1b4b">Password strength by length (random, 73-character set)</text><text x="40" y="131" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">8 chars</text><rect x="190" y="95" width="305" height="52" rx="10" fill="#ef4444"/><text x="508.7298244371701" y="131" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">50 bits</text><text x="40" y="216" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">12 chars</text><rect x="190" y="180" width="457" height="52" rx="10" fill="#f59e0b"/><text x="661.094736655755" y="216" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">74 bits</text><text x="40" y="301" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">16 chars</text><rect x="190" y="265" width="609" height="52" rx="10" fill="#10b981"/><text x="813.4596488743402" y="301" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">99 bits</text><text x="40" y="386" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">20 chars</text><rect x="190" y="350" width="762" height="52" rx="10" fill="#059669"/><text x="965.8245610929253" y="386" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">124 bits</text><text x="600" y="445" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#4b5563">Each extra character adds about 6 bits. Length matters more than clever substitutions.</text></svg>