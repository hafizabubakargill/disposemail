<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="t d"><title id="t">Four layers of online privacy</title><desc id="d">Stacked layers: accounts and email, browser, network and device, each addressing a different part of online privacy.</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs><rect width="1200" height="480" rx="24" fill="#ffffff"/><rect x="1" y="1" width="1198" height="478" rx="24" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="600" y="50" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1e1b4b">Privacy comes in layers</text><rect x="60" y="90" width="1080" height="72" rx="14" fill="#c7d2fe"/><text x="90" y="122" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e1b4b">Accounts and email</text><text x="90" y="148" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1e1b4b">Separate addresses and unique passwords</text><rect x="60" y="178" width="1080" height="72" rx="14" fill="#a5b4fc"/><text x="90" y="210" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e1b4b">Browser</text><text x="90" y="236" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1e1b4b">Tracker blocking, fewer extensions, clean profiles</text><rect x="60" y="266" width="1080" height="72" rx="14" fill="#818cf8"/><text x="90" y="298" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#ffffff">Network</text><text x="90" y="324" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#ffffff">VPN or Tor change what sites see of your IP</text><rect x="60" y="354" width="1080" height="72" rx="14" fill="#6366f1"/><text x="90" y="386" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#ffffff">Device</text><text x="90" y="412" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#ffffff">Updates, disk encryption, screen locks</text><text x="600" y="455" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#4b5563">No single layer makes you anonymous. Decide what you are protecting against first.</text></svg>