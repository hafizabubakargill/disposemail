<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" role="img" aria-labelledby="t d"><title id="t">Five levels of email address validation</title><desc id="d">From syntax check to domain, mail records, mailbox probe and finally a confirmation link, which is the only check that proves ownership.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#4f46e5"/></linearGradient></defs><rect width="1200" height="490" rx="24" fill="#ffffff"/><rect x="1" y="1" width="1198" height="488" rx="24" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="600" y="50" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1e1b4b">Five levels of email validation</text><rect x="60" y="85" width="1080" height="60" rx="12" fill="#e0e7ff"/><text x="90" y="123" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#1e1b4b">1. Syntax</text><text x="330" y="123" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#1f2937">Looks like name@domain</text><text x="1110" y="123" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#374151">Weakest</text><rect x="60" y="157" width="1080" height="60" rx="12" fill="#c7d2fe"/><text x="90" y="195" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#1e1b4b">2. Domain exists</text><text x="330" y="195" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#1f2937">DNS knows the domain</text><text x="1110" y="195" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#374151"></text><rect x="60" y="229" width="1080" height="60" rx="12" fill="#a5b4fc"/><text x="90" y="267" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#1e1b4b">3. Mail records</text><text x="330" y="267" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#1f2937">Domain has MX records</text><text x="1110" y="267" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#374151"></text><rect x="60" y="301" width="1080" height="60" rx="12" fill="#fde68a"/><text x="90" y="339" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#1e1b4b">4. Mailbox probe</text><text x="330" y="339" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#1f2937">Server says the mailbox exists</text><text x="1110" y="339" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#374151">Often unreliable</text><rect x="60" y="373" width="1080" height="60" rx="12" fill="#34d399"/><text x="90" y="411" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#1e1b4b">5. Confirmation link</text><text x="330" y="411" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#1f2937">The owner clicks it</text><text x="1110" y="411" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#374151">Strongest</text><text x="600" y="465" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#4b5563">Only the last level proves a person controls the address.</text></svg>