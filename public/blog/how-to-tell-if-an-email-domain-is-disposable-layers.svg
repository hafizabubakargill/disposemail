<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Four layers of disposable email detection</title><desc id="d">A pyramid of four checks: domain list, MX check, confirmation email and behaviour signals.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#4f46e5"/></linearGradient><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs><rect width="1200" height="500" rx="24" fill="#ffffff"/><rect x="1" y="1" width="1198" height="498" rx="24" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="600" y="55" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#1e1b4b">Four detection layers, from cheap to strong</text><rect x="345.0" y="95" width="510.0" height="78" rx="14" fill="#c7d2fe"/><text x="600" y="128" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#1e1b4b">1. Domain list</text><text x="600" y="156" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1e1b4b">Fast and simple. Misses new domains.</text><rect x="260.0" y="190" width="680.0" height="78" rx="14" fill="#a5b4fc"/><text x="600" y="223" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#1e1b4b">2. MX / DNS check</text><text x="600" y="251" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1e1b4b">Catches invented or mistyped domains.</text><rect x="175.0" y="285" width="850.0" height="78" rx="14" fill="#818cf8"/><text x="600" y="318" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#fff">3. Confirmation email</text><text x="600" y="346" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#fff">Proves someone can read the inbox.</text><rect x="90.0" y="380" width="1020.0" height="78" rx="14" fill="#6366f1"/><text x="600" y="413" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#fff">4. Behaviour signals</text><text x="600" y="441" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#fff">Strongest. Needs data and effort.</text></svg>