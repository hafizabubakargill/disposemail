<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Which address for which purchase?</title><desc id="d">Decision guide for which email address to use when shopping online: real address or alias for orders, throwaway only for one-off coupons.</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs><rect width="1200" height="420" rx="24" fill="#ffffff"/><rect x="1" y="1" width="1198" height="418" rx="24" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="600" y="50" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1e1b4b">Which address for which purchase?</text><rect x="30.0" y="90" width="560.0" height="118" rx="14" fill="#f9fafb" stroke="#6366f1" stroke-width="2"/><text x="52.0" y="128" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#3730a3">Need orders, returns or warranty?</text><text x="52.0" y="160" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#374151">Use a real address or a forwarding alias you can</text><text x="52.0" y="184" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#374151">switch off later.</text><rect x="610.0" y="90" width="560.0" height="118" rx="14" fill="#f9fafb" stroke="#6366f1" stroke-width="2"/><text x="632.0" y="128" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#3730a3">One-off coupon or download?</text><text x="632.0" y="160" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#374151">A throwaway inbox is a reasonable fit.</text><rect x="30.0" y="224" width="560.0" height="118" rx="14" fill="#f9fafb" stroke="#6366f1" stroke-width="2"/><text x="52.0" y="262" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#3730a3">Buying from a store you do not know?</text><text x="52.0" y="294" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#374151">Check the site first. Consider guest checkout</text><text x="52.0" y="318" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#374151">and a virtual or one-time card.</text><rect x="610.0" y="224" width="560.0" height="118" rx="14" fill="#f9fafb" stroke="#6366f1" stroke-width="2"/><text x="632.0" y="262" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#3730a3">Creating an account you will keep?</text><text x="632.0" y="294" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#374151">Use an address you can recover, and turn on two-</text><text x="632.0" y="318" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#374151">factor authentication.</text><text x="600" y="380" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#4b5563">Never give a throwaway address to a store you expect to buy from: you lose order updates and</text><text x="600" y="405" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#4b5563">support.</text></svg>