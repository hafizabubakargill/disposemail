<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="t d"><title id="t">When a temporary email address is a good or poor fit</title><desc id="d">Good fit: one-off downloads, newsletter walls, testing, keeping marketing out. Poor fit: banking, recoverable accounts, private mail, work accounts.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#4f46e5"/></linearGradient></defs><rect width="1200" height="440" rx="24" fill="#ffffff"/><rect x="1" y="1" width="1198" height="438" rx="24" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="600" y="50" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1e1b4b">Good fit and poor fit for a temporary address</text><rect x="30" y="90" width="560" height="320" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="310" y="132" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#047857">Reasonable fit</text><text x="60" y="185" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#064e3b">&#10003;  One-off download or coupon</text><text x="60" y="241" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#064e3b">&#10003;  Newsletter wall you will not revisit</text><text x="60" y="297" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#064e3b">&#10003;  Testing your own signup form</text><text x="60" y="353" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#064e3b">&#10003;  Keeping marketing out of your inbox</text><rect x="610" y="90" width="560" height="320" rx="16" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="890" y="132" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#b91c1c">Poor fit</text><text x="640" y="185" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#7f1d1d">&#10007;  Banking, health or government</text><text x="640" y="241" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#7f1d1d">&#10007;  Accounts you must recover later</text><text x="640" y="297" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#7f1d1d">&#10007;  Anything private in the inbox</text><text x="640" y="353" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#7f1d1d">&#10007;  Work or school accounts</text></svg>