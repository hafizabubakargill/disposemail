<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="t d"><title id="t">MX host name patterns for common email providers</title><desc id="d">Table mapping Google, Microsoft 365, Zoho and Cloudflare to their typical MX host names.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#4f46e5"/></linearGradient><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs><rect width="1200" height="480" rx="24" fill="#ffffff"/><rect x="1" y="1" width="1198" height="478" rx="24" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="600" y="55" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#1e1b4b">Common MX host name patterns</text><rect x="30" y="95" width="1140" height="64" rx="12" fill="#eef2ff"/><text x="55" y="136" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e1b4b">Google Workspace / Gmail</text><text x="560" y="136" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#374151">aspmx.l.google.com, *.googlemail.com</text><rect x="30" y="175" width="1140" height="64" rx="12" fill="#f9fafb"/><text x="55" y="216" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e1b4b">Microsoft 365</text><text x="560" y="216" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#374151">*.mail.protection.outlook.com</text><rect x="30" y="255" width="1140" height="64" rx="12" fill="#eef2ff"/><text x="55" y="296" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e1b4b">Zoho Mail</text><text x="560" y="296" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#374151">mx.zoho.com, mx2.zoho.com</text><rect x="30" y="335" width="1140" height="64" rx="12" fill="#f9fafb"/><text x="55" y="376" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e1b4b">Cloudflare Email Routing</text><text x="560" y="376" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#374151">*.mx.cloudflare.net (forwards mail on)</text><text x="600" y="440" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#6b7280">Forwarding or filtering services can hide the real mailbox provider. Treat results as a strong hint.</text></svg>