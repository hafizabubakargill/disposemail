<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="t d"><title id="t">How one email address links your activity across sites</title><desc id="d">Several sites each record your email. A shared email or its hash lets a data broker merge them into one profile, which is then shared or sold.</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs><rect width="1200" height="470" rx="24" fill="#ffffff"/><rect x="1" y="1" width="1198" height="468" rx="24" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="600" y="50" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1e1b4b">How one email address links your activity</text><rect x="30" y="90" width="230" height="62" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="145.0" y="128.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#1e1b4b">Online store</text><line x1="260" y1="121" x2="420" y2="205" stroke="#4f46e5" stroke-width="3" marker-end="url(#ar)"/><rect x="30" y="170" width="230" height="62" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="145.0" y="208.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#1e1b4b">Fitness app</text><line x1="260" y1="201" x2="420" y2="205" stroke="#4f46e5" stroke-width="3" marker-end="url(#ar)"/><rect x="30" y="250" width="230" height="62" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="145.0" y="288.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#1e1b4b">Loyalty card</text><line x1="260" y1="281" x2="420" y2="205" stroke="#4f46e5" stroke-width="3" marker-end="url(#ar)"/><rect x="30" y="330" width="230" height="62" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="145.0" y="368.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#1e1b4b">Free quiz site</text><line x1="260" y1="361" x2="420" y2="205" stroke="#4f46e5" stroke-width="3" marker-end="url(#ar)"/><rect x="420" y="150" width="260" height="110" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="550.0" y="184.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#1e1b4b">Same email</text><text x="550.0" y="212.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#1e1b4b">(or its hash)</text><text x="550.0" y="240.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#1e1b4b">= same person</text><line x1="680" y1="205" x2="760" y2="205" stroke="#4f46e5" stroke-width="3" marker-end="url(#ar)"/><rect x="760" y="150" width="200" height="110" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="860.0" y="198.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#1e1b4b">One merged</text><text x="860.0" y="226.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#1e1b4b">profile</text><line x1="960" y1="205" x2="1010" y2="205" stroke="#4f46e5" stroke-width="3" marker-end="url(#ar)"/><rect x="1010" y="150" width="160" height="110" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="1090.0" y="185.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1e1b4b">Sold or</text><text x="1090.0" y="211.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1e1b4b">shared for</text><text x="1090.0" y="237.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1e1b4b">ads, risk</text><text x="600" y="430" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#4b5563">A different address per service breaks the link: each site only sees its own slice.</text></svg>