<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="t d"><title id="t">Milestones in email privacy</title><desc id="d">Timeline: 1971 first network email, 1982 SMTP, 1991 PGP, 1996 webmail, 2018 GDPR, 2021 Apple Mail Privacy Protection.</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs><rect width="1200" height="330" rx="24" fill="#ffffff"/><rect x="1" y="1" width="1198" height="328" rx="24" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="600" y="50" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1e1b4b">Milestones in email privacy</text><line x1="60" y1="190" x2="1140" y2="190" stroke="#4f46e5" stroke-width="4"/><circle cx="100" cy="190" r="12" fill="#4f46e5"/><text x="100" y="150" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e1b4b">1971</text><text x="100" y="235" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#374151">First email sent</text><text x="100" y="257" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#374151">over a network</text><circle cx="300" cy="190" r="12" fill="#4f46e5"/><text x="300" y="150" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e1b4b">1982</text><text x="300" y="235" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#374151">SMTP defined (RFC</text><text x="300" y="257" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#374151">821)</text><circle cx="500" cy="190" r="12" fill="#4f46e5"/><text x="500" y="150" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e1b4b">1991</text><text x="500" y="235" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#374151">PGP released for</text><text x="500" y="257" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#374151">encrypted email</text><circle cx="700" cy="190" r="12" fill="#4f46e5"/><text x="700" y="150" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e1b4b">1996</text><text x="700" y="235" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#374151">Webmail launches</text><text x="700" y="257" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#374151">(Hotmail)</text><circle cx="900" cy="190" r="12" fill="#4f46e5"/><text x="900" y="150" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e1b4b">2018</text><text x="900" y="235" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#374151">GDPR starts to</text><text x="900" y="257" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#374151">apply in the EU</text><circle cx="1100" cy="190" r="12" fill="#4f46e5"/><text x="1100" y="150" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#1e1b4b">2021</text><text x="1100" y="235" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#374151">Apple Mail</text><text x="1100" y="257" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#374151">Privacy</text><text x="1100" y="279" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#374151">Protection</text><text x="600" y="305" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#4b5563">Each step added convenience first; privacy protections came later.</text></svg>