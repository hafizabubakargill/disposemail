<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="t d"><title id="t">Comparison of throwaway inbox, email alias and plus-addressing</title><desc id="d">Three columns compare how each option works and when it is the best choice.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#4f46e5"/></linearGradient><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs><rect width="1200" height="440" rx="24" fill="#ffffff"/><rect x="1" y="1" width="1198" height="438" rx="24" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="600" y="55" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#1e1b4b">Throwaway inbox vs alias vs plus-addressing</text><rect x="40" y="90" width="355" height="310" rx="18" fill="#f9fafb" stroke="#4f46e5" stroke-width="3"/><rect x="40" y="90" width="355" height="62" rx="18" fill="#4f46e5"/><text x="217" y="130" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#fff">Throwaway inbox</text><text x="68" y="205" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1f2937">&#8226; No account needed</text><text x="68" y="259" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1f2937">&#8226; Deleted automatically</text><text x="68" y="313" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1f2937">&#8226; Cannot be recovered</text><text x="68" y="367" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1f2937">&#8226; Best: one-off codes</text><rect x="425" y="90" width="355" height="310" rx="18" fill="#f9fafb" stroke="#0891b2" stroke-width="3"/><rect x="425" y="90" width="355" height="62" rx="18" fill="#0891b2"/><text x="602" y="130" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#fff">Provider alias</text><text x="453" y="205" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1f2937">&#8226; Forwards to real inbox</text><text x="453" y="259" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1f2937">&#8226; Can be switched off</text><text x="453" y="313" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1f2937">&#8226; Needs an account</text><text x="453" y="367" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1f2937">&#8226; Best: accounts you keep</text><rect x="810" y="90" width="355" height="310" rx="18" fill="#f9fafb" stroke="#d97706" stroke-width="3"/><rect x="810" y="90" width="355" height="62" rx="18" fill="#d97706"/><text x="987" y="130" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#fff">Plus-addressing</text><text x="838" y="205" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1f2937">&#8226; Built into some providers</text><text x="838" y="259" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1f2937">&#8226; Your real address is visible</text><text x="838" y="313" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1f2937">&#8226; Hides very little</text><text x="838" y="367" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1f2937">&#8226; Best: filtering mail</text></svg>