<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Four ways an email address ends up on spam lists</title><desc id="d">Scraping, breaches, purchased lists and guessing are the four common routes spammers use to get addresses.</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs><rect width="1200" height="420" rx="24" fill="#ffffff"/><rect x="1" y="1" width="1198" height="418" rx="24" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="600" y="50" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1e1b4b">Four ways your address ends up on spam lists</text><rect x="30" y="95" width="550" height="105" rx="14" fill="#f9fafb" stroke="#6366f1" stroke-width="2"/><text x="54" y="137" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#3730a3">Scraping</text><text x="54" y="173" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#374151">Bots harvest addresses from web pages and forums</text><rect x="610" y="95" width="550" height="105" rx="14" fill="#f9fafb" stroke="#6366f1" stroke-width="2"/><text x="634" y="137" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#3730a3">Breaches</text><text x="634" y="173" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#374151">A leaked database is traded and reused</text><rect x="30" y="225" width="550" height="105" rx="14" fill="#f9fafb" stroke="#6366f1" stroke-width="2"/><text x="54" y="267" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#3730a3">Purchased lists</text><text x="54" y="303" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#374151">Lists are bought and resold between senders</text><rect x="610" y="225" width="550" height="105" rx="14" fill="#f9fafb" stroke="#6366f1" stroke-width="2"/><text x="634" y="267" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#3730a3">Guessing</text><text x="634" y="303" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#374151">Common name patterns are tried at scale</text><text x="600" y="385" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#4b5563">Fewer places holding your real address means fewer ways in.</text></svg>