<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="t d"><title id="t">Six warning signs of a phishing email</title><desc id="d">Urgency, mismatched sender, misleading links, unexpected attachments, requests for credentials, and generic greetings.</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs><rect width="1200" height="400" rx="24" fill="#ffffff"/><rect x="1" y="1" width="1198" height="398" rx="24" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="600" y="50" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1e1b4b">Six warning signs of a phishing email</text><rect x="30" y="95" width="370" height="100" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="56" y="140" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#b91c1c">1</text><text x="100" y="138" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#7f1d1d">Urgent threat or</text><text x="100" y="165" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#7f1d1d">deadline</text><rect x="420" y="95" width="370" height="100" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="446" y="140" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#b91c1c">2</text><text x="490" y="138" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#7f1d1d">Sender address does not</text><text x="490" y="165" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#7f1d1d">match the brand</text><rect x="810" y="95" width="370" height="100" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="836" y="140" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#b91c1c">3</text><text x="880" y="138" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#7f1d1d">Link text differs from</text><text x="880" y="165" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#7f1d1d">the real link</text><rect x="30" y="220" width="370" height="100" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="56" y="265" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#b91c1c">4</text><text x="100" y="263" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#7f1d1d">Unexpected attachment</text><rect x="420" y="220" width="370" height="100" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="446" y="265" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#b91c1c">5</text><text x="490" y="263" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#7f1d1d">Asks for a password or</text><text x="490" y="290" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#7f1d1d">code</text><rect x="810" y="220" width="370" height="100" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="836" y="265" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#b91c1c">6</text><text x="880" y="263" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#7f1d1d">Generic greeting, odd</text><text x="880" y="290" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#7f1d1d">wording</text><text x="600" y="365" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#4b5563">One sign is a reason to pause. Two or more: do not click, go to the site yourself.</text></svg>