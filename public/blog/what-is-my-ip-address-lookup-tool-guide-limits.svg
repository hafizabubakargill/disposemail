<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="t d"><title id="t">What an IP address lookup shows and does not show</title><desc id="d">A lookup typically shows approximate location, provider, ASN and time zone, but not your name, address, browsing history or exact location.</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs><rect width="1200" height="440" rx="24" fill="#ffffff"/><rect x="1" y="1" width="1198" height="438" rx="24" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="600" y="50" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1e1b4b">What an IP lookup can and cannot tell you</text><rect x="30" y="90" width="560" height="320" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="310" y="132" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#047857">Usually shows</text><text x="60" y="185" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#064e3b">&#10003;  Approximate city / region / country</text><text x="60" y="241" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#064e3b">&#10003;  Internet provider or organisation</text><text x="60" y="297" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#064e3b">&#10003;  Network number (ASN)</text><text x="60" y="353" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#064e3b">&#10003;  Time zone</text><rect x="610" y="90" width="560" height="320" rx="16" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="890" y="132" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#b91c1c">Does not show</text><text x="640" y="185" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#7f1d1d">&#10007;  Your street address or name</text><text x="640" y="241" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#7f1d1d">&#10007;  Which person is using the device</text><text x="640" y="297" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#7f1d1d">&#10007;  Your browsing history</text><text x="640" y="353" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#7f1d1d">&#10007;  Exact location (city is often off)</text></svg>