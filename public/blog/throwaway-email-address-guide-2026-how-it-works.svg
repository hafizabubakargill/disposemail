<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="t d"><title id="t">How a throwaway email inbox works</title><desc id="d">Five steps: open the site, paste the address, receive the message, copy the code, inbox deleted after one hour.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#4f46e5"/></linearGradient><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs><rect width="1200" height="340" rx="24" fill="#ffffff"/><rect x="1" y="1" width="1198" height="338" rx="24" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="600" y="60" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#1e1b4b">How a throwaway inbox works</text><rect x="40" y="120" width="200" height="110" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="140.0" y="167.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e1b4b">1. Open the site</text><text x="140.0" y="197.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1e1b4b">get an address</text><line x1="240" y1="175" x2="290" y2="175" stroke="#4f46e5" stroke-width="3" marker-end="url(#ar)"/><rect x="290" y="120" width="200" height="110" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="390.0" y="167.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e1b4b">2. Paste address</text><text x="390.0" y="197.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1e1b4b">into the signup form</text><line x1="490" y1="175" x2="540" y2="175" stroke="#4f46e5" stroke-width="3" marker-end="url(#ar)"/><rect x="540" y="120" width="200" height="110" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="640.0" y="167.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e1b4b">3. Message arrives</text><text x="640.0" y="197.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1e1b4b">in your browser</text><line x1="740" y1="175" x2="790" y2="175" stroke="#4f46e5" stroke-width="3" marker-end="url(#ar)"/><rect x="790" y="120" width="200" height="110" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="890.0" y="167.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e1b4b">4. Copy the code</text><text x="890.0" y="197.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1e1b4b">or link</text><line x1="990" y1="175" x2="1020" y2="175" stroke="#4f46e5" stroke-width="3" marker-end="url(#ar)"/><rect x="1020" y="120" width="140" height="110" rx="16" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="1090.0" y="167.66666666666666" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#1e1b4b">5. Deleted</text><text x="1090.0" y="195.66666666666666" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#1e1b4b">after 1 hour</text><text x="600" y="300" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#4b5563">No account, no password. The inbox is receive-only and cannot be recovered after it expires.</text></svg>