<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Four jobs a privacy extension can do</title><desc id="d">Four categories of privacy browser extension: blocking trackers, hiding your email, filling passwords and limiting what sites can see.</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs><rect width="1200" height="420" rx="24" fill="#ffffff"/><rect x="1" y="1" width="1198" height="418" rx="24" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="600" y="50" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1e1b4b">Four jobs a privacy extension can do</text><rect x="30.0" y="90" width="560.0" height="118" rx="14" fill="#f9fafb" stroke="#6366f1" stroke-width="2"/><text x="52.0" y="128" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#3730a3">Block trackers and ads</text><text x="52.0" y="160" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#374151">Stops third-party scripts and tracking pixels</text><text x="52.0" y="184" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#374151">from loading.</text><rect x="610.0" y="90" width="560.0" height="118" rx="14" fill="#f9fafb" stroke="#6366f1" stroke-width="2"/><text x="632.0" y="128" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#3730a3">Hide your email address</text><text x="632.0" y="160" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#374151">Creates aliases or temporary addresses for sign-</text><text x="632.0" y="184" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#374151">up forms.</text><rect x="30.0" y="224" width="560.0" height="118" rx="14" fill="#f9fafb" stroke="#6366f1" stroke-width="2"/><text x="52.0" y="262" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#3730a3">Fill strong passwords</text><text x="52.0" y="294" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#374151">Generates and stores a unique password per site.</text><rect x="610.0" y="224" width="560.0" height="118" rx="14" fill="#f9fafb" stroke="#6366f1" stroke-width="2"/><text x="632.0" y="262" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#3730a3">Limit what sites can see</text><text x="632.0" y="294" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#374151">Clears cookies, isolates sites, or blocks</text><text x="632.0" y="318" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#374151">fingerprinting.</text><text x="600" y="380" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#4b5563">Fewer extensions with clear permissions beat a long list you do not review.</text></svg>