<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="t d"><title id="t">QR code error correction levels</title><desc id="d">Bars show the four error correction levels: L about 7 percent, M 15, Q 25 and H 30 percent damage tolerated.</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs><rect width="1200" height="460" rx="24" fill="#ffffff"/><rect x="1" y="1" width="1198" height="458" rx="24" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="600" y="50" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1e1b4b">QR error correction levels</text><text x="40" y="126" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">L  Low</text><rect x="260" y="90" width="145" height="52" rx="10" fill="#a5b4fc"/><text x="418.66666666666663" y="126" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#111827">about 7% damage tolerated</text><text x="40" y="206" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">M  Medium</text><rect x="260" y="170" width="310" height="52" rx="10" fill="#818cf8"/><text x="584.0" y="206" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#111827">about 15% damage tolerated</text><text x="40" y="286" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">Q  Quartile</text><rect x="260" y="250" width="517" height="52" rx="10" fill="#6366f1"/><text x="790.6666666666667" y="286" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#111827">about 25% damage tolerated</text><text x="40" y="366" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">H  High</text><rect x="260" y="330" width="620" height="52" rx="10" fill="#4338ca"/><text x="894.0" y="366" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#111827">about 30% damage tolerated</text><text x="600" y="430" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#4b5563">Higher levels survive more damage but need a denser, larger code. M is a common default.</text></svg>