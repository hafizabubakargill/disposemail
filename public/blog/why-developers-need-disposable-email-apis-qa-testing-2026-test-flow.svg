<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" role="img" aria-labelledby="t d"><title id="t">Email verification test flow</title><desc id="d">Five steps: create a fresh address, the app sends the email, the test inbox receives it, the test polls with a timeout, then asserts on the code or link.</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs><rect width="1200" height="310" rx="24" fill="#ffffff"/><rect x="1" y="1" width="1198" height="308" rx="24" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="600" y="50" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1e1b4b">A reliable email test, step by step</text><rect x="30" y="100" width="210" height="110" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="135.0" y="135.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1e1b4b">1. Test starts</text><text x="135.0" y="161.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1e1b4b">creates a fresh</text><text x="135.0" y="187.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1e1b4b">test address</text><line x1="240" y1="155" x2="285" y2="155" stroke="#4f46e5" stroke-width="3" marker-end="url(#ar)"/><rect x="285" y="100" width="210" height="110" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="390.0" y="148.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1e1b4b">2. App under test</text><text x="390.0" y="174.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1e1b4b">sends the email</text><line x1="495" y1="155" x2="540" y2="155" stroke="#4f46e5" stroke-width="3" marker-end="url(#ar)"/><rect x="540" y="100" width="210" height="110" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="645.0" y="148.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1e1b4b">3. Test inbox</text><text x="645.0" y="174.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1e1b4b">receives it</text><line x1="750" y1="155" x2="795" y2="155" stroke="#4f46e5" stroke-width="3" marker-end="url(#ar)"/><rect x="795" y="100" width="180" height="110" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="885.0" y="148.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1e1b4b">4. Test polls</text><text x="885.0" y="174.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1e1b4b">with a timeout</text><line x1="975" y1="155" x2="1015" y2="155" stroke="#4f46e5" stroke-width="3" marker-end="url(#ar)"/><rect x="1015" y="100" width="160" height="110" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="1095.0" y="148.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1e1b4b">5. Assert</text><text x="1095.0" y="174.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1e1b4b">code / link</text><text x="600" y="270" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#4b5563">Use a unique address per run, poll with a timeout instead of fixed sleeps, and clean up after.</text></svg>