<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">How a leaked email can lead to account takeover</title><desc id="d">Four-step chain from a leaked email address to account takeover, and how unique passwords, two-factor authentication and separate addresses break it.</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs><rect width="1200" height="300" rx="24" fill="#ffffff"/><rect x="1" y="1" width="1198" height="298" rx="24" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="600" y="50" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1e1b4b">How a leaked email can lead to account takeover</text><rect x="30.0" y="100" width="255.0" height="120" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="157.5" y="153.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1e1b4b">1. Address leaks</text><text x="157.5" y="179.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1e1b4b">from one breached site</text><line x1="285.0" y1="160" x2="325.0" y2="160" stroke="#4f46e5" stroke-width="3" marker-end="url(#ar)"/><rect x="325.0" y="100" width="255.0" height="120" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="452.5" y="153.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1e1b4b">2. Attacker tries</text><text x="452.5" y="179.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1e1b4b">reused passwords</text><line x1="580.0" y1="160" x2="620.0" y2="160" stroke="#4f46e5" stroke-width="3" marker-end="url(#ar)"/><rect x="620.0" y="100" width="255.0" height="120" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="747.5" y="153.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1e1b4b">3. Or requests a</text><text x="747.5" y="179.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1e1b4b">password reset by email</text><line x1="875.0" y1="160" x2="915.0" y2="160" stroke="#4f46e5" stroke-width="3" marker-end="url(#ar)"/><rect x="915.0" y="100" width="255.0" height="120" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="1042.5" y="153.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1e1b4b">4. Account taken</text><text x="1042.5" y="179.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1e1b4b">over</text><text x="600" y="265" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#4b5563">Break the chain: unique passwords, two-factor authentication, and a separate address for low-</text><text x="600" y="290" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#4b5563">value sites.</text></svg>