<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="t d"><title id="t">Comparison table of disposable email checks</title><desc id="d">Rows compare domain list, MX check, confirmation email and behaviour signals on typo detection, new disposable domains and proving a person.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#4f46e5"/></linearGradient><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs><rect width="1200" height="460" rx="24" fill="#ffffff"/><rect x="1" y="1" width="1198" height="458" rx="24" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="600" y="55" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#1e1b4b">What each check can and cannot tell you</text><text x="40" y="110" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#4f46e5">Check</text><text x="360" y="110" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#4f46e5">Catches typos</text><text x="620" y="110" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#4f46e5">Catches new disposable</text><text x="900" y="110" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#4f46e5">Proves a person</text><rect x="30" y="118" width="1140" height="56" rx="10" fill="#f3f4f6"/><text x="40" y="155" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#111827">Domain list</text><text x="360" y="155" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#b91c1c">No</text><text x="620" y="155" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#b91c1c">No (only listed)</text><text x="900" y="155" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#b91c1c">No</text><rect x="30" y="188" width="1140" height="56" rx="10" fill="#ffffff"/><text x="40" y="225" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#111827">MX / DNS check</text><text x="360" y="225" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#047857">Yes</text><text x="620" y="225" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#b91c1c">No</text><text x="900" y="225" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#b91c1c">No</text><rect x="30" y="258" width="1140" height="56" rx="10" fill="#f3f4f6"/><text x="40" y="295" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#111827">Confirmation email</text><text x="360" y="295" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#047857">Yes</text><text x="620" y="295" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#b91c1c">No</text><text x="900" y="295" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#92400e">Partly</text><rect x="30" y="328" width="1140" height="56" rx="10" fill="#ffffff"/><text x="40" y="365" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#111827">Behaviour signals</text><text x="360" y="365" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#92400e">Some</text><text x="620" y="365" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#047857">Often</text><text x="900" y="365" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#92400e">Partly</text></svg>