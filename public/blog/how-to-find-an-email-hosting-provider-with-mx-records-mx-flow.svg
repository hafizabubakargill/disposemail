<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="t d"><title id="t">How MX records route email</title><desc id="d">A sender asks DNS for the MX record of the recipient domain, receives a mail server name, and delivers the message there.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#4f46e5"/></linearGradient><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs><rect width="1200" height="340" rx="24" fill="#ffffff"/><rect x="1" y="1" width="1198" height="338" rx="24" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="600" y="55" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#1e1b4b">How a sender finds where to deliver mail</text><rect x="40" y="120" width="230" height="120" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="155.0" y="172.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e1b4b">Sender</text><text x="155.0" y="202.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1e1b4b">you@example.com</text><line x1="270" y1="180" x2="330" y2="180" stroke="#4f46e5" stroke-width="3" marker-end="url(#ar)"/><rect x="330" y="120" width="260" height="120" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="460.0" y="172.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e1b4b">DNS lookup</text><text x="460.0" y="202.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1e1b4b">MX for company.com</text><line x1="590" y1="180" x2="650" y2="180" stroke="#4f46e5" stroke-width="3" marker-end="url(#ar)"/><rect x="650" y="120" width="230" height="120" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="765.0" y="172.83333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1e1b4b">MX answer</text><text x="765.0" y="199.83333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#1e1b4b">10 aspmx.l.google.com</text><line x1="880" y1="180" x2="930" y2="180" stroke="#4f46e5" stroke-width="3" marker-end="url(#ar)"/><rect x="930" y="120" width="230" height="120" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="1045.0" y="172.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1e1b4b">Mail server</text><text x="1045.0" y="202.33333333333334" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#1e1b4b">accepts the message</text><text x="600" y="300" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#4b5563">Lowest priority number is tried first; higher numbers are fallbacks. No MX and no address record means no delivery.</text></svg>