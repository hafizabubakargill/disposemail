<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="t d"><title id="t">Anatomy of a version 4 UUID</title><desc id="d">A UUID written as groups of 8, 4, 4, 4 and 12 hexadecimal digits, with the version digit in the third group and the variant digit in the fourth.</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs><rect width="1200" height="330" rx="24" fill="#ffffff"/><rect x="1" y="1" width="1198" height="328" rx="24" fill="none" stroke="#e5e7eb" stroke-width="2"/><text x="600" y="50" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#1e1b4b">Anatomy of a version 4 UUID</text><rect x="40" y="100" width="230" height="80" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="155.0" y="152" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#111827">f47ac10b</text><text x="155.0" y="215" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#6b7280">8 hex</text><rect x="285" y="100" width="150" height="80" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="360.0" y="152" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#111827">58cc</text><text x="360.0" y="215" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#6b7280">4 hex</text><rect x="450" y="100" width="150" height="80" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="525.0" y="152" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#111827">4372</text><text x="525.0" y="215" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#6b7280">4 hex</text><rect x="615" y="100" width="150" height="80" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="690.0" y="152" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#111827">a567</text><text x="690.0" y="215" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#6b7280">4 hex</text><rect x="780" y="100" width="330" height="80" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="945.0" y="152" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#111827">0e02b2c3d479</text><text x="945.0" y="215" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#6b7280">12 hex</text><text x="600" y="270" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#4b5563">The first digit of the third group is the version (4). The first digit of the fourth group marks the variant (8, 9, a or b).</text><text x="600" y="300" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#4b5563">The remaining 122 bits are random, so duplicates are astronomically unlikely.</text></svg>